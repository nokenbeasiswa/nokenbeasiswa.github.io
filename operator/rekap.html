<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Rekap Penerima | Panel Operator DB BEASISWA</title>
  <link rel="icon" type="image/svg+xml" href="../asset/img/logo-dinas.svg">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN + konfigurasi bersama -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../asset/js/tailwind.config.js"></script>

  <!-- Font Awesome 6 (JS SVG CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- Alpine.js v3 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

  <!-- Design system + panel -->
  <link rel="stylesheet" href="../asset/css/style.css">
  <link rel="stylesheet" href="../admin/assets/admin.css">

  <!-- Data & komponen -->
  <script src="../asset/js/store.js"></script>
  <script src="../admin/assets/crud.js"></script>
</head>

<body class="admin" data-role="operator" data-page="rekap" data-title="Rekap Penerima" data-group="Laporan & Analitik">

  <div id="admin-sidebar"></div>

  <div class="admin-body">
    <div id="admin-topbar"></div>

    <main class="admin-content">
      <div class="page-head">
        <div>
          <h2>Rekapitulasi Jumlah Penerima</h2>
        </div>
      </div>

      <div x-data="rekap()" class="grid lg:grid-cols-2 gap-6">
        <template x-for="t in tables" :key="t.title">
          <div class="card overflow-hidden">
            <div class="flex items-center justify-between px-5 py-4 border-b border-line">
              <h3 class="font-bold" x-text="t.title"></h3>
              <span class="text-sm text-muted" x-text="'Total ' + total"></span>
            </div>
            <table class="table">
              <thead><tr><th x-text="t.col"></th><th class="!text-right">Jumlah</th><th class="w-2/5">Porsi</th></tr></thead>
              <tbody>
                <template x-for="r in t.rows" :key="r.label">
                  <tr>
                    <td x-text="r.label"></td>
                    <td class="text-right font-semibold tabular-nums" x-text="r.value"></td>
                    <td><div class="flex items-center gap-3"><div class="bar-track flex-1"><div class="bar-fill" :style="'width:' + r.pct + '%'"></div></div><span class="text-sm text-muted tabular-nums w-12 text-right" x-text="r.pct.toFixed(0) + '%'"></span></div></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </div>
    </main>

    <div id="admin-footer"></div>
  </div>

  <script src="../admin/assets/layout.js"></script>
  <script>var U = AdminUtil;</script>
  <script>
    function rekap() {
      var rows = DB.get('penerima');
      var total = rows.length || 1;
      function by(labels, fn) {
        return labels.map(function (l) {
          var v = rows.filter(function (r) { return fn(r) === l; }).length;
          return { label: l, value: v, pct: v / total * 100 };
        });
      }
      var beasiswa = DB.get('beasiswa');
      return {
        total: rows.length,
        tables: [
          { title: 'Per kabupaten asal', col: 'Kabupaten', rows: by(DB.KABUPATEN, function (r) { return r.kabupaten; }).sort(function (a, b) { return b.value - a.value; }) },
          { title: 'Per jenjang', col: 'Jenjang', rows: by(DB.JENJANG, function (r) { return r.jenjang; }) },
          { title: 'Per status studi', col: 'Status', rows: by(['Aktif', 'Cuti', 'Lulus', 'Berhenti'], function (r) { return r.status; }) },
          { title: 'Per program beasiswa', col: 'Program', rows: by(beasiswa.map(function (b) { return b.nama; }), function (r) { var b = DB.find('beasiswa', r.beasiswa_id); return b && b.nama; }) }
        ]
      };
    }
  </script>
</body>
</html>
