<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Peta GIS | Panel Operator DB BEASISWA</title>
  <link rel="icon" type="image/svg+xml" href="../asset/img/logo-dinas.svg">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN + konfigurasi bersama -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../asset/js/tailwind.config.js"></script>

  <!-- Font Awesome 6 (JS SVG CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <!-- Alpine.js v3 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

  <!-- Design system + panel -->
  <link rel="stylesheet" href="../asset/css/style.css">
  <link rel="stylesheet" href="../admin/assets/admin.css">

  <!-- Data & komponen -->
  <script src="../asset/js/store.js"></script>
  <script src="../admin/assets/crud.js"></script>
  <script src="../admin/assets/map.js"></script>
</head>

<body class="admin" data-role="operator" data-page="peta" data-title="Peta GIS" data-group="Laporan & Analitik">

  <div id="admin-sidebar"></div>

  <div class="admin-body">
    <div id="admin-topbar"></div>

    <main class="admin-content">
      <div class="page-head">
        <div>
          <h2>Peta GIS Sebaran Penerima</h2>
        </div>
      </div>

      <div class="card overflow-hidden">
        <div class="flex flex-wrap items-center justify-between gap-3 px-5 py-4 border-b border-line">
          <h3 class="font-bold flex items-center gap-3"><i class="fa-solid fa-map-location-dot text-brand" aria-hidden="true"></i> Sebaran kampus tujuan</h3>
          <div class="flex items-center gap-4 text-sm text-muted">
            <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-brand"></span> Dalam negeri</span>
            <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-gold"></span> Luar negeri</span>
          </div>
        </div>
        <div id="overview-map" class="h-[560px] isolate z-0"></div>
      </div>
    </main>

    <div id="admin-footer"></div>
  </div>

  <script src="../admin/assets/layout.js"></script>
  <script>var U = AdminUtil;</script>
  <script>
    AdminMap.overview('#overview-map', function () {
    return DB.get('kampus').map(function (k) {
      var n = DB.find('negara', k.negara_id);
      return { lat: k.lat, lng: k.lng, tone: n && n.kode === 'ID' ? 'dalam' : 'luar', label: k.jumlah_penerima || 0,
        html: '<strong>' + U.esc(k.nama) + '</strong><br><span style="color:var(--muted)">' + U.esc(k.kota) + ', ' + (n ? U.esc(n.nama) : '') + '</span><br>' + U.angka(k.jumlah_penerima) + ' penerima' };
    });
  });
  </script>
</body>
</html>
