<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peta Sebaran GIS | DB BEASISWA</title>
  <meta name="description" content="Peta sebaran kampus dan penerima beasiswa Provinsi Papua Pegunungan.">
  <link rel="icon" type="image/svg+xml" href="asset/img/logo-dinas.svg">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN + konfigurasi bersama -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="asset/js/tailwind.config.js"></script>

  <!-- Font Awesome 6 (JS SVG CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Alpine.js v3 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

  <!-- Design system -->
  <link rel="stylesheet" href="asset/css/style.css">

  <style>
    .leaflet-container { font-family: 'Inter', sans-serif; }
    .leaflet-popup-content-wrapper {
      border-radius: 8px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .leaflet-popup-content { margin: 14px 16px; }
    .gis-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(23, 32, 51, .35);
      font: 700 11px/1 'Inter', sans-serif;
    }
    .gis-marker.dalam { background: var(--blue); color: #fff; }
    .gis-marker.luar  { background: var(--gold); color: var(--ink); }
  </style>
</head>

<body data-page="peta">

  <!-- TEMPLATE: topbar + header/navbar -->
  <div id="site-header"></div>

  <main x-data="gisApp()" x-init="initApp()">

    <!-- KEPALA HALAMAN -->
    <section class="page-hero">
      <div class="container relative z-10">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb">
            <li><a href="index.html">Beranda</a></li>
            <li><span aria-current="page">Peta Sebaran GIS</span></li>
          </ol>
        </nav>
        <h1>Peta Sebaran Penerima Beasiswa</h1>
        <p>Visualisasi lokasi kampus dan jumlah penerima beasiswa di dalam dan luar negeri.</p>
      </div>
    </section>

    <!-- PETA -->
    <section class="py-14 sm:py-16">
      <div class="container">

        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
          <div class="segmented" role="tablist" aria-label="Filter lokasi">
            <button type="button" @click="setFilter('semua')" :class="activeFilter === 'semua' && 'is-active'">
              Semua (<span x-text="locations.length"></span>)
            </button>
            <button type="button" @click="setFilter('dalam')" :class="activeFilter === 'dalam' && 'is-active'">
              Dalam Negeri (<span x-text="locations.filter(l => l.category === 'dalam').length"></span>)
            </button>
            <button type="button" @click="setFilter('luar')" :class="activeFilter === 'luar' && 'is-active'">
              Luar Negeri (<span x-text="locations.filter(l => l.category === 'luar').length"></span>)
            </button>
          </div>

          <div class="flex items-center gap-5 text-sm text-muted">
            <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-brand"></span> Dalam negeri</span>
            <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-gold"></span> Luar negeri</span>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <!-- Peta -->
          <div class="lg:col-span-8 card p-2 relative isolate">
            <div class="absolute top-5 right-5 z-[400] hidden sm:flex items-center gap-2 bg-white px-3 py-2 rounded-md border border-line text-sm text-muted" style="box-shadow: var(--shadow)">
              <i class="fa-solid fa-location-dot text-brand" aria-hidden="true"></i>
              <span>Menampilkan <strong class="text-ink" x-text="filteredLocations.length"></strong> titik kampus</span>
            </div>
            <div id="map" class="w-full h-[460px] lg:h-[580px] rounded-md z-10"></div>
          </div>

          <!-- Daftar -->
          <div class="lg:col-span-4 card flex flex-col">
            <div class="px-6 py-5 border-b border-line">
              <h2 class="font-bold flex items-center gap-3">
                <i class="fa-solid fa-building-columns text-brand" aria-hidden="true"></i> Daftar perguruan tinggi
              </h2>
            </div>

            <div class="p-3 space-y-2 overflow-y-auto max-h-[480px] flex-1">
              <template x-for="item in filteredLocations" :key="item.id">
                <button type="button" @click="focusLocation(item)"
                        class="w-full text-left p-4 rounded-lg border border-transparent hover:border-brand-100 hover:bg-brand-50 transition-colors flex items-start justify-between gap-3">
                  <span>
                    <span class="block font-semibold text-[15px] text-ink" x-text="item.name"></span>
                    <span class="block text-sm text-muted mt-1" x-text="item.city + ', ' + item.country"></span>
                  </span>
                  <span class="shrink-0 badge" :class="item.category === 'luar' && 'badge-gold'" x-text="item.students + ' mhs'"></span>
                </button>
              </template>
            </div>

            <div class="px-6 py-4 border-t border-line text-center">
              <button type="button" @click="resetMapView()" class="link-arrow">
                <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i> Reset tampilan peta
              </button>
            </div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- TEMPLATE: footer -->
  <div id="site-footer"></div>

  <script src="asset/js/layout.js"></script>
  <script>
    function gisApp() {
      return {
        activeFilter: 'semua',
        map: null,
        markersGroup: null,

        locations: [
          { id: 1, name: "Institut Teknologi Bandung (ITB)", category: "dalam", city: "Bandung", country: "Indonesia", lat: -6.8915, lng: 107.6107, students: 142 },
          { id: 2, name: "Universitas Indonesia (UI)", category: "dalam", city: "Depok", country: "Indonesia", lat: -6.3652, lng: 106.8310, students: 185 },
          { id: 3, name: "Universitas Gadjah Mada (UGM)", category: "dalam", city: "Yogyakarta", country: "Indonesia", lat: -7.7713, lng: 110.3775, students: 210 },
          { id: 4, name: "Universitas Cenderawasih (UNCEN)", category: "dalam", city: "Jayapura", country: "Indonesia", lat: -2.5912, lng: 140.6690, students: 340 },
          { id: 5, name: "Harvard University", category: "luar", city: "Cambridge", country: "Amerika Serikat", lat: 42.3770, lng: -71.1167, students: 18 },
          { id: 6, name: "University of Oxford", category: "luar", city: "Oxford", country: "Inggris", lat: 51.7548, lng: -1.2544, students: 24 },
          { id: 7, name: "University of Melbourne", category: "luar", city: "Melbourne", country: "Australia", lat: -37.7963, lng: 144.9614, students: 65 },
          { id: 8, name: "Monash University", category: "luar", city: "Melbourne", country: "Australia", lat: -37.9105, lng: 145.1362, students: 52 },
          { id: 9, name: "Kyoto University", category: "luar", city: "Kyoto", country: "Jepang", lat: 35.0262, lng: 135.7808, students: 31 },
          { id: 10, name: "Leiden University", category: "luar", city: "Leiden", country: "Belanda", lat: 52.1561, lng: 4.4857, students: 22 }
        ],

        get filteredLocations() {
          if (this.activeFilter === 'semua') return this.locations;
          return this.locations.filter(item => item.category === this.activeFilter);
        },

        initApp() {
          this.$nextTick(() => { this.initMap(); });
        },

        initMap() {
          this.map = L.map('map', {
            zoomControl: true,
            scrollWheelZoom: false
          }).setView([0, 115], 3);

          // OpenStreetMap (tanpa API key)
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
          }).addTo(this.map);

          this.markersGroup = L.layerGroup().addTo(this.map);
          this.renderMarkers();
        },

        renderMarkers() {
          if (!this.map || !this.markersGroup) return;
          this.markersGroup.clearLayers();

          const bounds = L.latLngBounds();

          this.filteredLocations.forEach(loc => {
            const customIcon = L.divIcon({
              className: '',
              html: `<div class="gis-marker ${loc.category}">${loc.students}</div>`,
              iconSize: [34, 34],
              iconAnchor: [17, 17]
            });

            const isDalam = loc.category === 'dalam';
            const marker = L.marker([loc.lat, loc.lng], { icon: customIcon });
            marker.bindPopup(`
              <div style="min-width:200px">
                <span class="badge ${isDalam ? '' : 'badge-gold'}">${isDalam ? 'Dalam Negeri' : 'Luar Negeri'}</span>
                <div style="margin-top:8px;font-weight:700;font-size:14px;color:var(--ink)">${loc.name}</div>
                <div style="font-size:13px;color:var(--muted)">${loc.city}, ${loc.country}</div>
                <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:13px">
                  <span>Penerima</span><strong style="color:var(--blue)">${loc.students} mahasiswa</strong>
                </div>
              </div>
            `);

            this.markersGroup.addLayer(marker);
            bounds.extend([loc.lat, loc.lng]);
          });

          if (this.filteredLocations.length > 0) {
            this.map.fitBounds(bounds, { padding: [50, 50], maxZoom: 10 });
          }
        },

        setFilter(filterType) {
          this.activeFilter = filterType;
          this.renderMarkers();
        },

        focusLocation(loc) {
          if (!this.map) return;
          this.map.setView([loc.lat, loc.lng], 9, { animate: true });
          this.markersGroup.eachLayer(layer => {
            const latLng = layer.getLatLng();
            if (latLng.lat === loc.lat && latLng.lng === loc.lng) layer.openPopup();
          });
        },

        resetMapView() {
          this.activeFilter = 'semua';
          this.renderMarkers();
        }
      }
    }
  </script>
</body>
</html>
