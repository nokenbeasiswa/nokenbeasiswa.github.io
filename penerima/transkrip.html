<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Transkrip Nilai | Portal Penerima DB BEASISWA</title>
  <link rel="icon" type="image/svg+xml" href="../asset/img/logo-dinas.svg">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN + konfigurasi bersama -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../asset/js/tailwind.config.js"></script>

  <!-- Font Awesome 6 (JS SVG CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- Alpine.js v3 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

  <!-- Design system + panel -->
  <link rel="stylesheet" href="../asset/css/style.css">
  <link rel="stylesheet" href="../admin/assets/admin.css">

  <!-- Data & komponen -->
  <script src="../asset/js/store.js"></script>
  <script src="../admin/assets/crud.js"></script>
</head>

<body class="admin" data-role="penerima" data-page="transkrip" data-title="Transkrip Nilai" data-group="Laporan Studi">

  <div id="admin-sidebar"></div>

  <div class="admin-body">
    <div id="admin-topbar"></div>

    <main class="admin-content">
      <div class="page-head">
        <div>
          <h2>Transkrip Nilai</h2>
        </div>
      </div>

      <div x-data="{ p: U.currentPenerima() }" class="grid lg:grid-cols-3 gap-6">
        <div class="card p-6 lg:col-span-2">
          <h3 class="font-bold flex items-center gap-3"><i class="fa-solid fa-file-arrow-up text-brand" aria-hidden="true"></i> Riwayat unggahan</h3>
          <div class="mt-6 flex flex-col items-center justify-center gap-3 px-6 py-12 border-2 border-dashed border-line-strong rounded-lg text-center">
            <i class="fa-solid fa-file-circle-plus text-3xl text-muted" aria-hidden="true"></i>
            <p class="font-semibold">Belum ada transkrip yang diunggah</p>
            <p class="text-sm text-muted max-w-sm">Fitur unggah transkrip akan tersedia setelah sistem terhubung ke server.</p>
          </div>
        </div>
        <div class="card p-6">
          <span class="text-sm text-muted">IPK terakhir tercatat</span>
          <div class="stat-value" x-text="Number(p.ipk).toFixed(2)"></div>
          <div class="mt-3" x-html="U.badge(p.status)"></div>
          <p class="mt-4 text-sm text-muted">Tenggat unggah KHS semester genap 2026: <strong class="text-ink">30 Oktober 2026</strong>.</p>
        </div>
      </div>
    </main>

    <div id="admin-footer"></div>
  </div>

  <script src="../admin/assets/layout.js"></script>
  <script>var U = AdminUtil;</script>

</body>
</html>
