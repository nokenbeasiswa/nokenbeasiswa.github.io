<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Status Tiket | Portal Penerima DB BEASISWA</title>
  <link rel="icon" type="image/svg+xml" href="../asset/img/logo-dinas.svg">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN + konfigurasi bersama -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../asset/js/tailwind.config.js"></script>

  <!-- Font Awesome 6 (JS SVG CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- Alpine.js v3 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

  <!-- Design system + panel -->
  <link rel="stylesheet" href="../asset/css/style.css">
  <link rel="stylesheet" href="../admin/assets/admin.css">

  <!-- Data & komponen -->
  <script src="../asset/js/store.js"></script>
  <script src="../admin/assets/crud.js"></script>
</head>

<body class="admin" data-role="penerima" data-page="tiket-status" data-title="Status Tiket" data-group="Pengaduan Tiket">

  <div id="admin-sidebar"></div>

  <div class="admin-body">
    <div id="admin-topbar"></div>

    <main class="admin-content">
      <div class="page-head">
        <div>
          <h2>Status Tiket Pengaduan</h2>
          <p>Pantau status dan balasan petugas atas pengaduan Anda.</p>
        </div>
      </div>

      <div x-data="{ p: U.currentPenerima() }" x-init="p.tiket = DB.get('tiket').filter(function (t) { return t.pelapor === p.nama; })" class="space-y-4">
        <template x-for="t in p.tiket" :key="t.id">
          <article class="card">
            <div class="flex flex-wrap items-center justify-between gap-3 px-5 py-4 border-b border-line">
              <div><p class="text-sm text-muted tabular-nums" x-text="t.kode + ' · ' + U.tanggal(t.tanggal)"></p><h3 class="font-bold" x-text="t.subjek"></h3></div>
              <span x-html="U.badge(t.status)"></span>
            </div>
            <div class="p-5 space-y-3">
              <p class="text-[15px] text-muted whitespace-pre-line" x-text="t.pesan"></p>
              <template x-for="(b, i) in (t.balasan || [])" :key="i">
                <div class="rounded-lg border border-brand-100 bg-brand-50 p-4">
                  <p class="text-sm"><strong x-text="b.dari"></strong> <span class="text-muted" x-text="'· ' + U.waktu(b.waktu)"></span></p>
                  <p class="mt-1 text-[15px]" x-text="b.isi"></p>
                </div>
              </template>
              <p x-show="!(t.balasan || []).length" class="text-sm text-muted">Belum ada balasan dari petugas.</p>
            </div>
          </article>
        </template>
        <div x-show="!p.tiket.length" class="card p-10 text-center text-muted">Anda belum pernah membuat tiket pengaduan.</div>
      </div>
    </main>

    <div id="admin-footer"></div>
  </div>

  <script src="../admin/assets/layout.js"></script>
  <script>var U = AdminUtil;</script>

</body>
</html>
