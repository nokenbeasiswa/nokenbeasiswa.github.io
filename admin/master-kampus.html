<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Data Kampus | Admin DB BEASISWA</title>
  <link rel="icon" type="image/svg+xml" href="../asset/img/logo-dinas.svg">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN + konfigurasi bersama -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../asset/js/tailwind.config.js"></script>

  <!-- Font Awesome 6 (JS SVG CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <!-- Alpine.js v3 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

  <!-- Design system + panel admin -->
  <link rel="stylesheet" href="../asset/css/style.css">
  <link rel="stylesheet" href="assets/admin.css">

  <!-- Data & komponen -->
  <script src="../asset/js/store.js"></script>
  <script src="assets/crud.js"></script>
  <script src="assets/map.js"></script>
</head>

<body class="admin" data-page="kampus" data-title="Data Kampus" data-group="Master Data">

  <div id="admin-sidebar"></div>

  <div class="admin-body">
    <div id="admin-topbar"></div>

    <main class="admin-content">
      <div class="page-head">
        <div>
          <h2>Data Kampus</h2>
        </div>
      </div>

      <div class="card mb-6 overflow-hidden">
        <div class="flex items-center justify-between gap-4 px-5 py-4 border-b border-line">
          <h3 class="font-bold flex items-center gap-3"><i class="fa-solid fa-map-location-dot text-brand" aria-hidden="true"></i> Peta sebaran kampus</h3>
          <span class="text-sm text-muted">Biru = dalam negeri · Emas = luar negeri</span>
        </div>
        <div id="overview-map" class="h-[340px] isolate z-0"></div>
      </div>

      <div id="crud"></div>
    </main>

    <div id="admin-footer"></div>
  </div>

  <script src="assets/layout.js"></script>
  <script>
    var U = AdminUtil;
    AdminCrud.mount('#crud', {
      entity: 'kampus', singular: 'Kampus', modul: 'Master Data',
      searchKeys: ['nama', 'singkatan', 'kota'],
      filters: [
        { key: 'negara_id', label: 'Negara', options: function () { return DB.get('negara').map(function (n) { return { value: n.id, label: n.nama }; }); } },
        { key: 'jenis', label: 'Jenis', options: ['PTN', 'PTS', 'Luar Negeri'] }
      ],
      columns: [
        { label: 'Kampus', render: function (r) { return '<span class="font-semibold">' + U.esc(r.nama) + '</span><span class="sub">' + U.esc(r.singkatan) + ' · ' + U.esc(r.kota) + '</span>'; } },
        { label: 'Negara', render: function (r) { return U.lookup('negara', r.negara_id); } },
        { label: 'Jenis', render: function (r) { return U.badge(r.jenis, r.jenis === 'Luar Negeri' ? 'gold' : ''); } },
        { label: 'Penerima', class: 'tabular-nums font-semibold', render: function (r) { return U.angka(r.jumlah_penerima); } },
        { label: 'Koordinat', render: function (r) { return U.coords(r.lat, r.lng); }, csv: function (r) { return r.lat + ', ' + r.lng; } }
      ],
      fields: [
        { key: 'nama', label: 'Nama kampus', required: true, unique: true, span: 2 },
        { key: 'singkatan', label: 'Singkatan' },
        { key: 'negara_id', label: 'Negara', type: 'select', required: true, numeric: true, options: function () { return DB.get('negara').map(function (n) { return { value: n.id, label: n.nama }; }); } },
        { key: 'kota', label: 'Kota', required: true },
        { key: 'jenis', label: 'Jenis', type: 'select', required: true, options: ['PTN', 'PTS', 'Luar Negeri'] },
        { key: 'jumlah_penerima', label: 'Jumlah penerima (rekap)', type: 'number', default: 0, hint: 'Angka yang ditampilkan pada peta publik.' },
        { key: 'website', label: 'Situs web', placeholder: 'https://' },
        { type: 'map', lat: 'lat', lng: 'lng', label: 'Lokasi kampus', required: true, zoom: 13 }
      ]
    });
  </script>

  <script>
    AdminMap.overview('#overview-map', function () {
      return DB.get('kampus').map(function (k) {
        var n = DB.find('negara', k.negara_id);
        return { lat: k.lat, lng: k.lng, tone: n && n.kode === 'ID' ? 'dalam' : 'luar', label: k.jumlah_penerima || 0,
          html: '<strong>' + U.esc(k.nama) + '</strong><br><span style="color:var(--muted)">' + U.esc(k.kota) + ', ' + (n ? U.esc(n.nama) : '') + '</span><br>' + U.angka(k.jumlah_penerima) + ' penerima' };
      });
    }, { entities: ['kampus'] });
  </script>
</body>
</html>
