<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Penerima Beasiswa | Admin DB BEASISWA</title>
  <link rel="icon" type="image/svg+xml" href="../asset/img/logo-dinas.svg">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN + konfigurasi bersama -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../asset/js/tailwind.config.js"></script>

  <!-- Font Awesome 6 (JS SVG CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- Alpine.js v3 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

  <!-- Design system + panel admin -->
  <link rel="stylesheet" href="../asset/css/style.css">
  <link rel="stylesheet" href="assets/admin.css">

  <!-- Data & komponen -->
  <script src="../asset/js/store.js"></script>
  <script src="assets/crud.js"></script>
</head>

<body class="admin" data-page="penerima" data-title="Penerima Beasiswa" data-group="Layanan">

  <div id="admin-sidebar"></div>

  <div class="admin-body">
    <div id="admin-topbar"></div>

    <main class="admin-content">
      <div class="page-head">
        <div>
          <h2>Penerima Beasiswa</h2>
        </div>
      </div>

      <div id="crud"></div>
    </main>

    <div id="admin-footer"></div>
  </div>

  <script src="assets/layout.js"></script>
  <script>
    var U = AdminUtil;
    AdminCrud.mount('#crud', {
      entity: 'penerima', singular: 'Penerima', modul: 'Penerima Beasiswa',
      searchKeys: ['nama', 'nik', 'kabupaten', 'angkatan'],
      filters: [
        { key: 'status', label: 'Status', options: ['Aktif', 'Cuti', 'Lulus', 'Berhenti'] },
        { key: 'kabupaten', label: 'Kabupaten', options: DB.KABUPATEN },
        { key: 'jenjang', label: 'Jenjang', options: DB.JENJANG }
      ],
      columns: [
        { label: 'Nama', render: function (r) { return '<span class="font-semibold">' + U.esc(r.nama) + '</span><span class="sub tabular-nums">' + U.esc(r.nik) + '</span>'; } },
        { key: 'kabupaten', label: 'Kabupaten asal' },
        { label: 'Kampus & prodi', render: function (r) { return U.lookup('kampus', r.kampus_id) + '<span class="sub">' + U.lookup('prodi', r.prodi_id) + '</span>'; } },
        { label: 'Beasiswa', render: function (r) { return U.lookup('beasiswa', r.beasiswa_id); } },
        { label: 'Jenjang', render: function (r) { return U.badge(r.jenjang, 'green'); } },
        { label: 'IPK', class: 'tabular-nums', render: function (r) { return r.ipk !== '' && r.ipk !== undefined ? Number(r.ipk).toFixed(2) : '—'; } },
        { label: 'Status', render: function (r) { return U.badge(r.status); } }
      ],
      fields: [
        { key: 'nik', label: 'NIK', required: true, unique: true, hint: '16 digit sesuai KTP.' },
        { key: 'nama', label: 'Nama lengkap', required: true },
        { key: 'jk', label: 'Jenis kelamin', type: 'select', required: true, options: ['Laki-laki', 'Perempuan'] },
        { key: 'kabupaten', label: 'Kabupaten asal', type: 'select', required: true, options: DB.KABUPATEN },
        { key: 'beasiswa_id', label: 'Program beasiswa', type: 'select', required: true, numeric: true, span: 2, options: function () { return DB.get('beasiswa').map(function (b) { return { value: b.id, label: b.nama + ' (' + b.periode + ')' }; }); } },
        { key: 'kampus_id', label: 'Kampus', type: 'select', required: true, numeric: true, options: function () { return DB.get('kampus').map(function (k) { return { value: k.id, label: k.nama }; }); } },
        { key: 'prodi_id', label: 'Program studi', type: 'select', required: true, numeric: true, hint: 'Daftar mengikuti kampus yang dipilih.', options: function (form) {
            return DB.get('prodi').filter(function (p) { var f = DB.find('fakultas', p.fakultas_id); return !form.kampus_id || (f && String(f.kampus_id) === String(form.kampus_id)); })
              .map(function (p) { return { value: p.id, label: p.nama + ' (' + p.jenjang + ')' }; });
          } },
        { key: 'jenjang', label: 'Jenjang', type: 'select', required: true, options: DB.JENJANG },
        { key: 'angkatan', label: 'Angkatan', required: true, placeholder: '2026' },
        { key: 'ipk', label: 'IPK terakhir', type: 'number', step: '0.01' },
        { key: 'status', label: 'Status studi', type: 'select', required: true, options: ['Aktif', 'Cuti', 'Lulus', 'Berhenti'], default: 'Aktif' }
      ]
    });
  </script>
</body>
</html>
