<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Data Negara | Admin DB BEASISWA</title>
  <link rel="icon" type="image/svg+xml" href="../asset/img/logo-dinas.svg">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN + konfigurasi bersama -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../asset/js/tailwind.config.js"></script>

  <!-- Font Awesome 6 (JS SVG CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <!-- Alpine.js v3 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

  <!-- Design system + panel admin -->
  <link rel="stylesheet" href="../asset/css/style.css">
  <link rel="stylesheet" href="assets/admin.css">

  <!-- Data & komponen -->
  <script src="../asset/js/store.js"></script>
  <script src="assets/crud.js"></script>
  <script src="assets/map.js"></script>
</head>

<body class="admin" data-page="negara" data-title="Data Negara" data-group="Master Data">

  <div id="admin-sidebar"></div>

  <div class="admin-body">
    <div id="admin-topbar"></div>

    <main class="admin-content">
      <div class="page-head">
        <div>
          <h2>Data Negara</h2>
          <p>Negara tujuan studi beserta titik koordinat pusat negara untuk peta.</p>
        </div>
      </div>

      <div class="card mb-6 overflow-hidden">
        <div class="flex items-center justify-between gap-4 px-5 py-4 border-b border-line">
          <h3 class="font-bold flex items-center gap-3"><i class="fa-solid fa-map-location-dot text-brand" aria-hidden="true"></i> Peta negara tujuan</h3>
          <span class="text-sm text-muted">Titik hijau = pusat negara</span>
        </div>
        <div id="overview-map" class="h-[340px] isolate z-0"></div>
      </div>

      <div id="crud"></div>
    </main>

    <div id="admin-footer"></div>
  </div>

  <script src="assets/layout.js"></script>
  <script>
    var U = AdminUtil;
    AdminCrud.mount('#crud', {
      entity: 'negara', singular: 'Negara', modul: 'Master Data',
      searchKeys: ['nama', 'kode', 'benua'],
      filters: [{ key: 'benua', label: 'Benua', options: ['Asia', 'Oseania', 'Eropa', 'Amerika', 'Afrika'] }],
      columns: [
        { label: 'Kode', render: function (r) { return U.badge(r.kode); } },
        { key: 'nama', label: 'Negara', class: 'font-semibold' },
        { key: 'benua', label: 'Benua' },
        { label: 'Kampus', class: 'tabular-nums', render: function (r) { return DB.get('kampus').filter(function (k) { return String(k.negara_id) === String(r.id); }).length; } },
        { label: 'Koordinat', render: function (r) { return U.coords(r.lat, r.lng); }, csv: function (r) { return r.lat + ', ' + r.lng; } }
      ],
      fields: [
        { key: 'kode', label: 'Kode negara (ISO)', required: true, unique: true, placeholder: 'ID', hint: 'Dua huruf, mis. ID, AU, JP.' },
        { key: 'nama', label: 'Nama negara', required: true, unique: true },
        { key: 'benua', label: 'Benua', type: 'select', required: true, options: ['Asia', 'Oseania', 'Eropa', 'Amerika', 'Afrika'] },
        { type: 'map', lat: 'lat', lng: 'lng', label: 'Titik koordinat negara', required: true, zoom: 4 }
      ]
    });
  </script>

  <script>
    AdminMap.overview('#overview-map', function () {
      var kampus = DB.get('kampus');
      return DB.get('negara').map(function (n) {
        var jml = kampus.filter(function (k) { return String(k.negara_id) === String(n.id); }).length;
        return { lat: n.lat, lng: n.lng, tone: 'negara', label: U.esc(n.kode),
          html: '<strong>' + U.esc(n.nama) + '</strong><br><span style="color:var(--muted)">' + jml + ' kampus · ' + U.esc(n.benua) + '</span>' };
      });
    }, { entities: ['negara'], maxZoom: 4 });
  </script>
</body>
</html>
