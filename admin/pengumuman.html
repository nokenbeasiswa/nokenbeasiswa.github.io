<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Monitoring & Pengumuman | Admin DB BEASISWA</title>
  <link rel="icon" type="image/svg+xml" href="../asset/img/logo-dinas.svg">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN + konfigurasi bersama -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../asset/js/tailwind.config.js"></script>

  <!-- Font Awesome 6 (JS SVG CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- Alpine.js v3 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

  <!-- Design system + panel admin -->
  <link rel="stylesheet" href="../asset/css/style.css">
  <link rel="stylesheet" href="assets/admin.css">

  <!-- Data & komponen -->
  <script src="../asset/js/store.js"></script>
  <script src="assets/crud.js"></script>
</head>

<body class="admin" data-page="pengumuman" data-title="Monitoring & Pengumuman" data-group="Layanan">

  <div id="admin-sidebar"></div>

  <div class="admin-body">
    <div id="admin-topbar"></div>

    <main class="admin-content">
      <div class="page-head">
        <div>
          <h2>Monitoring &amp; Pengumuman Sistem</h2>
        </div>
      </div>

      <div x-data="monitor()" class="mb-8">
        <div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">
          <div class="card p-5">
            <div class="flex items-center gap-3"><span class="icon-box is-green"><i class="fa-solid fa-heart-pulse" aria-hidden="true"></i></span><span class="stat-label">Status layanan</span></div>
            <p class="mt-3 text-lg font-bold text-green flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-green animate-pulse"></span> Beroperasi normal</p>
            <p class="text-sm text-muted" x-text="'Diperiksa pukul ' + now"></p>
          </div>
          <div class="card p-5">
            <div class="flex items-center gap-3"><span class="icon-box"><i class="fa-solid fa-hard-drive" aria-hidden="true"></i></span><span class="stat-label">Penyimpanan data</span></div>
            <div class="stat-value !text-2xl" x-text="storage"></div>
            <p class="text-sm text-muted">Tersimpan di peramban (demo)</p>
          </div>
          <div class="card p-5">
            <div class="flex items-center gap-3"><span class="icon-box is-gold"><i class="fa-solid fa-ticket" aria-hidden="true"></i></span><span class="stat-label">Tiket belum selesai</span></div>
            <div class="stat-value !text-2xl" x-text="openTickets"></div>
            <a href="tiket.html" class="link-arrow mt-1">Tangani tiket <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
          </div>
          <div class="card p-5">
            <div class="flex items-center gap-3"><span class="icon-box"><i class="fa-solid fa-database" aria-hidden="true"></i></span><span class="stat-label">Backup terakhir</span></div>
            <p class="mt-3 text-lg font-bold" x-text="lastBackup"></p>
            <a href="backup.html" class="link-arrow mt-1">Backup sekarang <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
          </div>
        </div>

        <div class="card mt-4">
          <div class="flex flex-wrap items-center justify-between gap-2 px-5 py-4 border-b border-line">
            <h3 class="font-bold flex items-center gap-3"><i class="fa-solid fa-wave-square text-brand" aria-hidden="true"></i> Aktivitas sistem terbaru</h3>
            <span class="text-sm text-muted" x-text="activity24 + ' aktivitas dalam 24 jam terakhir'"></span>
          </div>
          <ul class="divide-y divide-line">
            <template x-for="a in recent" :key="a.id">
              <li class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4 px-5 py-3 text-[15px]">
                <span class="text-sm text-muted sm:w-48 shrink-0" x-text="U.waktu(a.waktu)"></span>
                <span x-html="U.badge(a.aksi)"></span>
                <span class="flex-1" x-text="a.keterangan"></span>
                <span class="text-sm text-muted" x-text="a.user"></span>
              </li>
            </template>
            <li x-show="recent.length === 0" class="px-5 py-6 text-center text-muted">Belum ada aktivitas.</li>
          </ul>
          <div class="px-5 py-3 border-t border-line"><a href="audit-log.html" class="link-arrow">Lihat audit log <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a></div>
        </div>
      </div>

      <div class="page-head !mb-4">
        <div>
          <h2 class="!text-xl">Pengumuman sistem</h2>
        </div>
      </div>

      <div id="crud"></div>
    </main>

    <div id="admin-footer"></div>
  </div>

  <script src="assets/layout.js"></script>
  <script>
    var U = AdminUtil;
    AdminCrud.mount('#crud', {
      entity: 'pengumuman', singular: 'Pengumuman', modul: 'Pengumuman', labelKey: 'judul',
      searchKeys: ['judul', 'isi', 'kategori'],
      filters: [
        { key: 'status', label: 'Status', options: ['Terbit', 'Draf'] },
        { key: 'kategori', label: 'Kategori', options: ['Penting', 'Pengumuman', 'Berita', 'Sistem'] }
      ],
      columns: [
        { label: 'Judul', render: function (r) { var s = String(r.isi || ''); return '<span class="font-semibold">' + U.esc(r.judul) + '</span><span class="sub">' + U.esc(s.length > 90 ? s.slice(0, 90) + '…' : s) + '</span>'; } },
        { label: 'Kategori', render: function (r) { return U.badge(r.kategori, { Penting: 'gold', Berita: 'green', Sistem: 'gray' }[r.kategori] || ''); } },
        { key: 'target', label: 'Sasaran' },
        { label: 'Tanggal', class: 'whitespace-nowrap', render: function (r) { return U.tanggal(r.tanggal); } },
        { label: 'Status', render: function (r) { return U.badge(r.status); } }
      ],
      fields: [
        { key: 'judul', label: 'Judul', required: true, span: 2 },
        { key: 'kategori', label: 'Kategori', type: 'select', required: true, options: ['Penting', 'Pengumuman', 'Berita', 'Sistem'] },
        { key: 'target', label: 'Sasaran', type: 'select', required: true, options: ['Publik', 'Penerima', 'Operator', 'Semua'], default: 'Publik' },
        { key: 'tanggal', label: 'Tanggal terbit', type: 'date', required: true },
        { key: 'status', label: 'Status', type: 'select', required: true, options: ['Terbit', 'Draf'], default: 'Draf' },
        { key: 'gambar', label: 'Gambar (opsional)', span: 2, placeholder: 'asset/img/berita-1.webp atau https://…', hint: 'Path dari folder utama situs atau URL gambar. Kosongkan untuk memakai gambar bawaan kategori.' },
      { key: 'isi', label: 'Isi pengumuman', type: 'textarea', required: true }
      ]
    });
  </script>

  <script>
    function monitor() {
      return {
        now: '', storage: '', openTickets: 0, lastBackup: '', recent: [], activity24: 0,
        init: function () {
          var self = this;
          this.refresh();
          window.addEventListener('crud:changed', function () { self.refresh(); });
        },
        refresh: function () {
          this.now = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
          var bytes = 0;
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k.indexOf('dbb_') === 0) bytes += (localStorage.getItem(k) || '').length * 2;
            }
          } catch (e) { /* abaikan */ }
          this.storage = (bytes / 1024).toFixed(1) + ' KB';
          this.openTickets = DB.get('tiket').filter(function (t) { return t.status !== 'Selesai'; }).length;
          var lb = DB.meta('last_backup');
          this.lastBackup = lb ? U.waktu(lb) : 'Belum pernah';
          var audit = DB.get('audit');
          var since = Date.now() - 864e5;
          this.activity24 = audit.filter(function (a) { return new Date(a.waktu).getTime() >= since; }).length;
          this.recent = audit.slice(0, 5);
        }
      };
    }
  </script>
</body>
</html>
