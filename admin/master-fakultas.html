<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Data Fakultas | Admin DB BEASISWA</title>
  <link rel="icon" type="image/svg+xml" href="../asset/img/logo-dinas.svg">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN + konfigurasi bersama -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../asset/js/tailwind.config.js"></script>

  <!-- Font Awesome 6 (JS SVG CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- Alpine.js v3 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

  <!-- Design system + panel admin -->
  <link rel="stylesheet" href="../asset/css/style.css">
  <link rel="stylesheet" href="assets/admin.css">

  <!-- Data & komponen -->
  <script src="../asset/js/store.js"></script>
  <script src="assets/crud.js"></script>
</head>

<body class="admin" data-page="fakultas" data-title="Data Fakultas" data-group="Master Data">

  <div id="admin-sidebar"></div>

  <div class="admin-body">
    <div id="admin-topbar"></div>

    <main class="admin-content">
      <div class="page-head">
        <div>
          <h2>Data Fakultas</h2>
        </div>
      </div>

      <div id="crud"></div>
    </main>

    <div id="admin-footer"></div>
  </div>

  <script src="assets/layout.js"></script>
  <script>
    var U = AdminUtil;
    AdminCrud.mount('#crud', {
      entity: 'fakultas', singular: 'Fakultas', modul: 'Master Data',
      searchKeys: ['nama'],
      filters: [{ key: 'kampus_id', label: 'Kampus', options: function () { return DB.get('kampus').map(function (k) { return { value: k.id, label: k.nama }; }); } }],
      columns: [
        { key: 'nama', label: 'Fakultas', class: 'font-semibold' },
        { label: 'Kampus', render: function (r) { return U.lookup('kampus', r.kampus_id); } },
        { label: 'Program studi', class: 'tabular-nums', render: function (r) { return DB.get('prodi').filter(function (p) { return String(p.fakultas_id) === String(r.id); }).length; } }
      ],
      fields: [
        { key: 'kampus_id', label: 'Kampus', type: 'select', required: true, numeric: true, span: 2, options: function () { return DB.get('kampus').map(function (k) { return { value: k.id, label: k.nama }; }); } },
        { key: 'nama', label: 'Nama fakultas', required: true, span: 2 }
      ]
    });
  </script>
</body>
</html>
