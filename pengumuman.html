<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Berita & Pengumuman | DB BEASISWA</title>
  <meta name="description" content="Berita dan pengumuman resmi program beasiswa Dinas Pendidikan Provinsi Papua Pegunungan.">
  <link rel="icon" type="image/svg+xml" href="asset/img/logo-dinas.svg">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN + konfigurasi bersama -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="asset/js/tailwind.config.js"></script>

  <!-- Font Awesome 6 (JS SVG CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- Alpine.js v3 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

  <!-- Design system -->
  <link rel="stylesheet" href="asset/css/style.css">

  <!-- Data bersama (dikelola dari panel admin) -->
  <script src="asset/js/store.js"></script>
</head>

<body data-page="pengumuman">

  <!-- TEMPLATE: topbar + header/navbar -->
  <div id="site-header"></div>

  <main>

    <!-- KEPALA HALAMAN -->
    <section class="page-hero">
      <div class="container relative z-10 text-center">
        <h1 class="uppercase">Pengumuman &amp; Berita</h1>
      </div>
    </section>

    <!-- DAFTAR -->
    <section class="py-14 sm:py-16" x-data="beritaPage()">
      <div class="container">
        <div class="max-w-5xl mx-auto">

          <!-- Pencarian & kategori -->
          <form class="flex flex-col sm:flex-row gap-3 sm:justify-center" role="search" @submit.prevent="page = 1">
            <div class="relative w-full sm:max-w-md">
              <label for="cari" class="sr-only">Pencarian</label>
              <input id="cari" type="search" class="input !pr-14" placeholder="Pencarian" x-model="q" @input="page = 1">
              <button type="submit" class="absolute right-1.5 top-1.5 bottom-1.5 w-10 rounded-md bg-navy text-white flex items-center justify-center hover:bg-brand transition-colors" aria-label="Cari">
                <i class="fa-solid fa-magnifying-glass text-sm" aria-hidden="true"></i>
              </button>
            </div>
            <label for="kategori" class="sr-only">Kategori</label>
            <select id="kategori" class="input sm:!w-52 cursor-pointer" x-model="kategori" @change="page = 1">
              <option value="">Semua kategori</option>
              <option>Penting</option>
              <option>Pengumuman</option>
              <option>Berita</option>
            </select>
          </form>

          <!-- Daftar -->
          <div class="mt-12 space-y-8 sm:space-y-10">
            <template x-for="p in paged" :key="p.id">
              <article class="grid sm:grid-cols-[220px_1fr] lg:grid-cols-[240px_1fr] gap-5 sm:gap-8 items-start">
                <div class="aspect-[16/9] sm:aspect-[9/8] rounded-lg overflow-hidden border border-line">
                  <template x-if="p.gambar">
                    <img :src="p.gambar" :alt="p.judul" loading="lazy" class="w-full h-full object-cover">
                  </template>
                  <template x-if="!p.gambar">
                    <div class="w-full h-full flex items-center justify-center" :class="thumb(p).bg">
                      <span class="w-14 h-14 rounded-lg bg-white/80 flex items-center justify-center text-2xl" :class="thumb(p).fg" x-html="thumb(p).icon"></span>
                    </div>
                  </template>
                </div>
                <div>
                  <div class="flex flex-wrap items-center gap-3">
                    <span class="badge" :class="{ 'badge-gold': p.kategori === 'Penting', 'badge-green': p.kategori === 'Berita' }" x-text="p.kategori"></span>
                    <time :datetime="p.tanggal" class="text-sm text-muted" x-text="tanggal(p.tanggal)"></time>
                  </div>
                  <h2 class="mt-3 text-xl font-bold leading-snug" x-text="p.judul"></h2>
                  <p class="mt-3 text-[16px] leading-relaxed text-muted text-justify" x-text="p.isi"></p>
                </div>
              </article>
            </template>

            <p x-show="filtered.length === 0" class="card p-10 text-center text-muted">Tidak ada pengumuman atau berita yang cocok.</p>
          </div>

          <!-- Halaman -->
          <nav x-show="pages > 1" class="mt-14 flex items-center gap-1 text-[16px]" aria-label="Halaman">
            <template x-for="n in pages" :key="n">
              <span class="flex items-center">
                <span x-show="n > 1" class="px-1.5 text-line-strong" aria-hidden="true">|</span>
                <button type="button" @click="go(n)" class="min-w-[28px] px-1 rounded hover:text-brand"
                        :class="n === page ? 'font-bold text-ink' : 'text-muted'" :aria-current="n === page ? 'page' : null" x-text="n"></button>
              </span>
            </template>
          </nav>

        </div>
      </div>
    </section>

  </main>

  <!-- TEMPLATE: footer -->
  <div id="site-footer"></div>

  <script src="asset/js/layout.js"></script>
  <script>
    function beritaPage() {
      var ICON = {
        Penting:    { bg: 'bg-gold-100',  fg: 'text-gold-dark', icon: '<i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>' },
        Berita:     { bg: 'bg-green-100', fg: 'text-green',     icon: '<i class="fa-solid fa-newspaper" aria-hidden="true"></i>' },
        Pengumuman: { bg: 'bg-brand-50',  fg: 'text-brand',     icon: '<i class="fa-solid fa-bullhorn" aria-hidden="true"></i>' }
      };
      return {
        q: '', kategori: '', page: 1, perPage: 5,
        // Data dikelola di Admin › Monitoring & Pengumuman (status Terbit, sasaran selain Operator)
        items: DB.get('pengumuman')
          .filter(function (p) { return p.status === 'Terbit' && p.target !== 'Operator'; })
          .sort(function (a, b) { return String(b.tanggal).localeCompare(String(a.tanggal)); }),
        get filtered() {
          var q = this.q.trim().toLowerCase(), k = this.kategori;
          return this.items.filter(function (p) {
            return (!k || p.kategori === k) && (!q || (p.judul + ' ' + p.isi).toLowerCase().indexOf(q) !== -1);
          });
        },
        get pages() { return Math.max(1, Math.ceil(this.filtered.length / this.perPage)); },
        get paged() {
          var start = (Math.min(this.page, this.pages) - 1) * this.perPage;
          return this.filtered.slice(start, start + this.perPage);
        },
        go: function (n) { this.page = n; window.scrollTo({ top: 0, behavior: 'smooth' }); },
        thumb: function (p) { return ICON[p.kategori] || ICON.Pengumuman; },
        tanggal: function (iso) { return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }); }
      };
    }
  </script>
</body>
</html>
