<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk | DB BEASISWA</title>
  <meta name="description" content="Masuk ke portal DB BEASISWA Dinas Pendidikan Provinsi Papua Pegunungan.">
  <link rel="icon" type="image/svg+xml" href="asset/img/logo-dinas.svg">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN + konfigurasi bersama -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="asset/js/tailwind.config.js"></script>

  <!-- Font Awesome 6 (JS SVG CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- Alpine.js v3 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

  <!-- Design system -->
  <link rel="stylesheet" href="asset/css/style.css">

  <!-- Data (sesi & audit log) -->
  <script src="asset/js/store.js"></script>
</head>

<body data-page="masuk" class="min-h-screen flex flex-col">

  <!-- TEMPLATE: topbar + header/navbar -->
  <div id="site-header"></div>

  <main class="flex-1 bg-white"
        x-data="{ role: 'admin', showPassword: false, loading: false, a: Math.floor(Math.random() * 9) + 1, b: Math.floor(Math.random() * 9) + 1 }">
    <div class="container py-16 sm:py-20">
      <h1 class="text-center text-3xl font-extrabold uppercase tracking-tight">Masuk</h1>

      <!-- Sementara: tanpa validasi, langsung ke panel sesuai peran -->
      <form class="mt-10 mx-auto w-full max-w-sm space-y-5" novalidate
            @submit.prevent="loading = true; DB.login($refs.username.value, role); window.location.href = DB.ROLES[role].panel + 'index.html'">

        <div>
          <label for="role" class="label">Masuk sebagai</label>
          <select id="role" class="input cursor-pointer" x-model="role">
            <option value="admin">Admin</option>
            <option value="operator">Operator</option>
            <option value="penerima">Penerima Beasiswa</option>
          </select>
        </div>

        <div>
          <label for="username" class="label">Username</label>
          <input id="username" name="username" x-ref="username" type="text" autocomplete="username" class="input">
        </div>

        <div>
          <label for="password" class="label">Password</label>
          <div class="relative">
            <input id="password" name="password" :type="showPassword ? 'text' : 'password'" autocomplete="current-password" class="input !pr-11">
            <button type="button" @click="showPassword = !showPassword" :aria-label="showPassword ? 'Sembunyikan password' : 'Tampilkan password'"
                    class="absolute inset-y-0 right-0 px-3.5 flex items-center text-slate-400 hover:text-ink">
              <span x-show="!showPassword"><i class="fa-solid fa-eye" aria-hidden="true"></i></span>
              <span x-show="showPassword" x-cloak><i class="fa-solid fa-eye-slash" aria-hidden="true"></i></span>
            </button>
          </div>
        </div>

        <div>
          <label for="captcha" class="label"><span x-text="a + ' + ' + b + ' = …'">1 + 3 = …</span></label>
          <input id="captcha" name="captcha" type="text" inputmode="numeric" autocomplete="off" class="input">
        </div>

        <div class="flex flex-wrap items-center gap-4 pt-1">
          <button type="submit" :disabled="loading" class="btn btn-primary disabled:opacity-70">
            <span x-show="!loading">Masuk</span>
            <span x-show="loading" x-cloak class="flex items-center gap-2"><i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i> Memproses…</span>
          </button>
          <span class="text-[15px] text-muted">Kendala? <a href="bantuan.html" class="font-semibold text-brand underline underline-offset-2 hover:text-brand-dark">Hubungi</a></span>
        </div>
      </form>
    </div>
  </main>

  <footer class="bg-navy-dark text-on-navy">
    <div class="noken-strip" aria-hidden="true"></div>
    <p class="container py-6 text-center text-sm">2026 &copy; Dinas Pendidikan Provinsi Papua Pegunungan</p>
  </footer>

  <script src="asset/js/layout.js"></script>
</body>
</html>
